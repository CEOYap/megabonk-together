# OmniBonk Changelog
# Shown in game after an update: write it for players.
# Format:
# [version."X.Y.Z"]
# changes = [
#     "Change 1 description",
#     "Change 2 description",
# ]

[version."1.0.0"]
changes = [
    "Everyone needs the same OmniBonk version. The lobby shows WRONG VERSION next to a player on a different one, and the host cannot start until it is fixed.",
    "Endless Run (lobby Options): the run goes on through Forest, Desert and Graveyard rooms, with a boss after every three, until everyone is dead. Enemies get tougher after each boss.",
    "No Projectile Cap (lobby Options): weapons can fire more than 80 projectiles in one burst.",
    "Lobby: every player sees everyone's name, and the host picks Saves, Shared XP, No Proj. Cap and Endless on the Options page.",
    "Lots of sync fixes: teammates' attacks and items look and work the same on every screen, bosses spawn where they should, revives land on the map, and shared XP keeps everyone's level the same.",
]
